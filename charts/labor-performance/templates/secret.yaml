{{- if and .Values.database.url (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "labor-performance.databaseSecretName" . }}
  labels:
    {{- include "labor-performance.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
{{- if and (or .Values.auth.readKey .Values.auth.readWriteKey) (not .Values.auth.existingSecret) }}
---
# Fleet-standard REST identity keys (ADR 0011). Rendered only when at least
# one key is set and no existing Secret is named; each key is emitted only
# when non-empty so a blank value never becomes an empty (= rejected) key.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "labor-performance.authSecretName" . }}
  labels:
    {{- include "labor-performance.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.readKey }}
  API_READ_KEY: {{ .Values.auth.readKey | quote }}
  {{- end }}
  {{- if .Values.auth.readWriteKey }}
  API_READWRITE_KEY: {{ .Values.auth.readWriteKey | quote }}
  {{- end }}
{{- end }}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: labor
      POSTGRES_PASSWORD: labor
      POSTGRES_DB: labor
    ports:
      - "5435:5432"
    volumes:
      - labor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  labor_pg_data:
